<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>幸福柑仔店｜本日營運日報</title>
  <style>
    :root {
      --bg: #f7f4ea;
      --ink: #3f3428;
      --muted: #766b5f;
      --card: #fffdf7;
      --line: #eadfc8;
      --store-orange: #f0a04b;
      --store-brown: #8f5e2f;
      --mint: #78c8a0;
      --sky: #a7d8f0;
      --cream: #f9e4a6;
      --care: #f4b6a6;
      --shadow: 0 18px 45px rgba(73, 55, 32, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(246, 216, 122, 0.45), transparent 32%),
        radial-gradient(circle at bottom right, rgba(167, 216, 240, 0.38), transparent 30%),
        linear-gradient(180deg, #fbf7ec 0%, #edf7ef 100%);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      padding: max(20px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
    }

    .store-awning {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 86px;
      background: repeating-linear-gradient(
        90deg,
        #ee8f43 0 34px,
        #fff4d8 34px 68px
      );
      border-bottom: 8px solid rgba(143, 94, 47, 0.18);
      opacity: 0.32;
      z-index: 0;
    }

    .result-wrap {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 44px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }

    .header {
      text-align: center;
      margin-top: 20px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 253, 247, 0.78);
      border: 1px solid rgba(234, 223, 200, 0.86);
      color: var(--store-brown);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 0 6px 16px rgba(97, 70, 39, 0.08);
    }

    h1 {
      margin: 16px 0 6px;
      font-size: clamp(30px, 8vw, 38px);
      line-height: 1.16;
      letter-spacing: 0.02em;
      color: var(--ink);
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .report-card {
      width: 100%;
      margin-top: 8px;
      padding: 24px 20px 22px;
      border-radius: 30px;
      background:
        linear-gradient(180deg, rgba(255, 253, 247, 0.98) 0%, rgba(255, 250, 238, 0.98) 100%);
      border: 1px solid rgba(234, 223, 200, 0.95);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .report-card::before,
    .report-card::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .report-card::before {
      width: 168px;
      height: 168px;
      top: -96px;
      right: -72px;
      background: rgba(120, 200, 160, 0.16);
    }

    .report-card::after {
      width: 118px;
      height: 118px;
      bottom: -62px;
      left: -44px;
      background: rgba(167, 216, 240, 0.2);
    }

    .badge-block {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 18px;
    }

    .badge-icon {
      width: 102px;
      height: 102px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
      margin-bottom: 12px;
      border: 7px solid rgba(255, 255, 255, 0.82);
      box-shadow: 0 14px 26px rgba(85, 57, 31, 0.18);
    }

    .tier-gold .badge-icon {
      background: linear-gradient(135deg, #ffe89d 0%, #f4a842 100%);
    }

    .tier-silver .badge-icon {
      background: linear-gradient(135deg, #f7f7f2 0%, #c9d5dc 100%);
    }

    .tier-care .badge-icon {
      background: linear-gradient(135deg, #ffd6c9 0%, #f4a08e 100%);
    }

    .badge-title {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 168px;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.04em;
      color: var(--ink);
      background: #fff8e6;
      border: 2px solid rgba(143, 94, 47, 0.14);
    }

    .tier-gold .badge-title {
      background: #fff5ce;
    }

    .tier-silver .badge-title {
      background: #f3f7f8;
    }

    .tier-care .badge-title {
      background: #fff0ec;
    }

    .copy-section {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 12px;
    }

    .copy-box {
      padding: 16px 16px 15px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid rgba(234, 223, 200, 0.82);
    }

    .copy-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 7px;
      color: var(--store-brown);
      font-weight: 800;
      font-size: 15px;
    }

    .copy-text {
      margin: 0;
      color: #4e443b;
      font-size: 18px;
      font-weight: 650;
      line-height: 1.66;
      letter-spacing: 0.01em;
    }

    .sub-copy {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .notice {
      position: relative;
      z-index: 1;
      margin-top: 14px;
      padding: 13px 14px;
      border-radius: 18px;
      background: rgba(120, 200, 160, 0.13);
      border: 1px solid rgba(120, 200, 160, 0.28);
      color: #5e6a5f;
      font-size: 13px;
      line-height: 1.65;
    }

    .notice strong {
      color: #4b6756;
    }

    .actions {
      display: flex;
      margin-top: 2px;
    }

    .home-btn {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--mint) 0%, #55b884 100%);
      color: white;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.04em;
      box-shadow: 0 10px 18px rgba(65, 149, 104, 0.28);
      cursor: pointer;
      touch-action: manipulation;
    }

    .home-btn:active {
      transform: translateY(2px);
      box-shadow: 0 6px 12px rgba(65, 149, 104, 0.26);
    }

    .footer-note {
      text-align: center;
      color: rgba(63, 52, 40, 0.48);
      font-size: 12px;
      line-height: 1.45;
      margin-top: 2px;
    }

    @media (max-height: 700px) {
      .result-wrap {
        justify-content: flex-start;
      }

      .header {
        margin-top: 76px;
      }

      h1 {
        font-size: 28px;
      }

      .badge-icon {
        width: 84px;
        height: 84px;
        font-size: 38px;
      }

      .copy-text {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <div class="store-awning" aria-hidden="true"></div>

    <section class="result-wrap" aria-label="幸福柑仔店結果頁">
      <header class="header">
        <div class="eyebrow">🏪 幸福柑仔店</div>
        <h1 id="resultPageTitle">本日營運日報</h1>
        <p id="resultSubtitle" class="subtitle">幸福柑仔店一日店長體驗完成</p>
      </header>

      <article id="reportCard" class="report-card tier-gold">
        <section class="badge-block" aria-label="本次結果">
          <div id="badgeIcon" class="badge-icon" aria-hidden="true">🏅</div>
          <div id="resultBadge" class="badge-title">金牌店長</div>
        </section>

        <section class="copy-section">
          <div class="copy-box">
            <div class="copy-label">📋 本日店務回饋</div>
            <p id="mainCopy" class="copy-text">本日店務觀察順利完成！你的反應、判斷與日常記憶小任務都表現穩定，是位讓人安心的幸福店長。</p>
          </div>

          <div class="copy-box">
            <div class="copy-label">🌿 店長小叮嚀</div>
            <p id="subCopyText" class="sub-copy">繼續保持規律生活、輕鬆動腦，之後也歡迎再回來巡店。</p>
          </div>
        </section>

        <aside class="notice" aria-label="溫馨提醒">
          <strong>溫馨提醒：</strong><span id="noticeCopy">本互動為日常腦健康趣味觀察，僅供自我關心參考。如對自己或家人的日常狀態有持續疑慮，建議尋求專業協助。</span>
        </aside>
      </article>

      <section class="actions">
        <button id="homeBtn" class="home-btn" type="button">回到首頁</button>
      </section>

      <p class="footer-note">結果僅作為本次互動回饋，不顯示分數與答題明細。</p>
    </section>
  </main>

  <script>
    /**
     * 內部整合說明：
     * - 前端不顯示量表名稱、實際分數、答題明細或提醒項目數。
     * - 後端可直接回傳 resultTier / resultBadge / mainCopy / subCopyText / noticeCopy / homeUrl。
     * - 若只回傳 reminderCount，前端此範例可先依 0 / 1 / 2+ 轉換，正式版仍建議由後端完成分層與文案回傳。
     */

    const DEFAULT_NOTICE = "本互動為日常腦健康趣味觀察，僅供自我關心參考。如對自己或家人的日常狀態有持續疑慮，建議尋求專業協助。";

    const COPY_BY_TIER = {
      gold: {
        resultTier: "gold",
        resultBadge: "金牌店長",
        icon: "🏅",
        mainCopy: "本日店務觀察順利完成！你的反應、判斷與日常記憶小任務都表現穩定，是位讓人安心的幸福店長。",
        subCopyText: "繼續保持規律生活、輕鬆動腦，之後也歡迎再回來巡店。"
      },
      silver: {
        resultTier: "silver",
        resultBadge: "銀牌店長",
        icon: "🥈",
        mainCopy: "本日大多數店務都順利完成，其中有一個小地方值得多留意。可能只是今天比較忙、比較累，或生活節奏有些變化。",
        subCopyText: "先不用緊張，保持好心情，也可以和家人一起多觀察日常小變化。"
      },
      care: {
        resultTier: "care",
        resultBadge: "暖心提醒",
        icon: "💛",
        mainCopy: "本日有幾個店務小任務需要多一點關心。這不代表結果好壞，只是提醒我們最近的生活節奏、記憶與判斷狀態，可以多留意一下。",
        subCopyText: "可以和家人聊聊最近的日常狀況，為自己多準備一點安心。"
      }
    };

    function tierFromReminderCount(reminderCount) {
      const count = Number(reminderCount);
      if (Number.isNaN(count)) return "gold";
      if (count <= 0) return "gold";
      if (count === 1) return "silver";
      return "care";
    }

    function getDataFromQueryString() {
      const params = new URLSearchParams(window.location.search);
      const tierParam = params.get("tier");
      const reminderCount = params.get("reminderCount");
      const homeUrl = params.get("homeUrl");

      const resultTier = COPY_BY_TIER[tierParam] ? tierParam : tierFromReminderCount(reminderCount);

      return {
        gameType: "ad8_story",
        gameName: "幸福柑仔店",
        resultPageTitle: "本日營運日報",
        resultSubtitle: "幸福柑仔店一日店長體驗完成",
        resultTier,
        noticeCopy: DEFAULT_NOTICE,
        homeUrl: homeUrl || "#"
      };
    }

    function renderResult(data) {
      const resultTier = COPY_BY_TIER[data.resultTier] ? data.resultTier : tierFromReminderCount(data.reminderCount);
      const preset = COPY_BY_TIER[resultTier];
      const merged = {
        resultPageTitle: "本日營運日報",
        resultSubtitle: "幸福柑仔店一日店長體驗完成",
        noticeCopy: DEFAULT_NOTICE,
        homeUrl: "#",
        ...preset,
        ...data,
        resultTier
      };

      document.getElementById("resultPageTitle").textContent = merged.resultPageTitle;
      document.getElementById("resultSubtitle").textContent = merged.resultSubtitle;
      document.getElementById("resultBadge").textContent = merged.resultBadge;
      document.getElementById("badgeIcon").textContent = merged.icon || preset.icon;
      document.getElementById("mainCopy").textContent = merged.mainCopy;
      document.getElementById("subCopyText").textContent = merged.subCopyText;
      document.getElementById("noticeCopy").textContent = merged.noticeCopy;

      const reportCard = document.getElementById("reportCard");
      reportCard.classList.remove("tier-gold", "tier-silver", "tier-care");
      reportCard.classList.add(`tier-${resultTier}`);

      const homeBtn = document.getElementById("homeBtn");
      homeBtn.onclick = () => {
        if (merged.homeUrl && merged.homeUrl !== "#") {
          window.location.href = merged.homeUrl;
        }
      };
    }

    document.addEventListener("DOMContentLoaded", () => {
      // IT 串接時可於載入本頁前注入 window.GO_HEALTH_RESULT_DATA。
      // 範例：window.GO_HEALTH_RESULT_DATA = { resultTier: "care", homeUrl: "https://..." };
      const resultData = window.GO_HEALTH_RESULT_DATA || getDataFromQueryString();
      renderResult(resultData);
    });
  </script>
</body>
</html>
